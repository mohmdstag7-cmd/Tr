name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        shell: pwsh
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Build executable
        shell: pwsh
        run: python scripts/build.py
        # scripts/build.py wraps the pyinstaller invocation and adds hidden imports.
        # Equivalent CLI (for reference):
        # pyinstaller --noconfirm --onedir --windowed --name MT5TradingWorkstation --collect-all MetaTrader5 --collect-all PySide6 --collect-all pyqtgraph app/main.py
        # Spec file path "scripts/build.spec" will be created later; build.py handles both spec and CLI fallback.

      - name: Self-check
        shell: pwsh
        # Must exit 0 if MetaTrader5 imports cleanly; --self-check is implemented in app/main.py
        run: dist\MT5TradingWorkstation\MT5TradingWorkstation.exe --self-check

      - name: Compress artifact
        shell: pwsh
        run: |
          $branch = "${{ github.head_ref || github.ref_name }}" -replace '[^a-zA-Z0-9._-]', '-'
          if (-not $branch) { $branch = "local" }
          $zipName = "MT5TradingWorkstation-$branch.zip"
          Write-Host "Creating $zipName from dist\MT5TradingWorkstation"
          Compress-Archive -Path dist\MT5TradingWorkstation -DestinationPath $zipName -Force
          Get-ChildItem -Filter "MT5TradingWorkstation-*.zip" | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT5TradingWorkstation-windows
          path: MT5TradingWorkstation-*.zip
          if-no-files-found: error
