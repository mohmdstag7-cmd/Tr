name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Inno Setup for the installer step (Phase 16 will use a real .iss;
          # for now we ship the PyInstaller one-folder build as a zip).
          choco install innosetup --no-progress --limit-output || true

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          Write-Host "Building MT5 Trading Workstation with PyInstaller..."
          python -m PyInstaller --noconfirm --onedir --windowed `
            --name MT5TradingWorkstation `
            --collect-all MetaTrader5 `
            --collect-all PySide6 `
            --collect-all pyqtgraph `
            app/main.py
          if (-not (Test-Path "dist/MT5TradingWorkstation")) {
            Write-Error "PyInstaller build failed: dist/MT5TradingWorkstation not found"
            exit 1
          }
          Write-Host "PyInstaller build complete."

      - name: Verify the build exists
        shell: pwsh
        run: |
          # Verify the build produced an exe. We don't run --version because
          # the GUI app may fail in headless CI (no display). The build.yml
          # workflow runs --self-check separately.
          $exePath = "dist/MT5TradingWorkstation/MT5TradingWorkstation.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Build failed: $exePath not found"
            exit 1
          }
          $size = (Get-Item $exePath).Length
          Write-Host "Built exe: $exePath ($size bytes)"
          if ($size -lt 1000000) {
            Write-Error "Built exe is too small ($size bytes) — likely a stub, not a real PyInstaller build"
            exit 1
          }
          Write-Host "Build verification OK."

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zipPath = "dist/MT5TradingWorkstation-$version-portable.zip"
          Compress-Archive -Path "dist/MT5TradingWorkstation/*" -DestinationPath $zipPath -Force
          if (-not (Test-Path $zipPath)) {
            Write-Error "Failed to create portable zip at $zipPath"
            exit 1
          }
          # Stub installer exe: copy the portable exe as the "installer" for
          # now. Phase 16 will replace this with a real Inno Setup installer.
          # The auto-updater verifies SHA-256, so this file must exist and
          # match the checksum we compute next.
          $installerPath = "dist/MT5TradingWorkstation-Setup-$version.exe"
          Copy-Item "dist/MT5TradingWorkstation/MT5TradingWorkstation.exe" $installerPath -Force
          Write-Host "Portable zip + installer stub created."

      - name: Compute SHA-256 checksums
        id: checksums
        shell: bash
        run: |
          set -e
          cd dist
          sha256sum MT5TradingWorkstation-Setup-*.exe | awk '{print $1}' > /tmp/installer_sha.txt
          sha256sum MT5TradingWorkstation-*-portable.zip | awk '{print $1}' > /tmp/portable_sha.txt
          echo "installer_sha=$(cat /tmp/installer_sha.txt)" >> "$GITHUB_OUTPUT"
          echo "portable_sha=$(cat /tmp/portable_sha.txt)" >> "$GITHUB_OUTPUT"
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate latest.json
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="mohmdstag7-cmd/Tr"
          INSTALLER_SHA=$(cat /tmp/installer_sha.txt)
          PORTABLE_SHA=$(cat /tmp/portable_sha.txt)
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TAG="${GITHUB_REF_NAME}"

          python - << 'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ.get("VERSION", "")
          # Fallback to GITHUB_REF_NAME parsing if env not set
          if not version:
              import re
              ref = os.environ.get("GITHUB_REF_NAME", "v0.1.0")
              version = ref.lstrip("v")

          repo = "mohmdstag7-cmd/Tr"
          tag = os.environ.get("GITHUB_REF_NAME", f"v{version}")
          installer_sha = Path("/tmp/installer_sha.txt").read_text().strip() if Path("/tmp/installer_sha.txt").exists() else ""
          portable_sha = Path("/tmp/portable_sha.txt").read_text().strip() if Path("/tmp/portable_sha.txt").exists() else ""
          import datetime
          published_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          # Allow overrides from env
          installer_sha = os.environ.get("INSTALLER_SHA", installer_sha)
          portable_sha = os.environ.get("PORTABLE_SHA", portable_sha)
          published_at = os.environ.get("PUBLISHED_AT", published_at)

          data = {
              "version": version,
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "installer_url": f"https://github.com/{repo}/releases/download/{tag}/MT5TradingWorkstation-Setup-{version}.exe",
              "installer_sha256": installer_sha,
              "portable_zip_url": f"https://github.com/{repo}/releases/download/{tag}/MT5TradingWorkstation-{version}-portable.zip",
              "portable_zip_sha256": portable_sha,
              "published_at": published_at,
              "min_supported_version": "0.1.0",
              "is_breaking": False,
              "release_notes": f"Release {tag}"
          }
          Path("dist/latest.json").write_text(json.dumps(data, indent=2))
          print(Path("dist/latest.json").read_text())
          PY
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INSTALLER_SHA: ${{ steps.checksums.outputs.installer_sha }}
          PORTABLE_SHA: ${{ steps.checksums.outputs.portable_sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MT5TradingWorkstation-Setup-*.exe
            dist/MT5TradingWorkstation-*-portable.zip
            dist/checksums.txt
            dist/latest.json
          generate_release_notes: true

      - name: Update latest tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force
