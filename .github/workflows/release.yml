name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        shell: pwsh
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: python scripts/build.py

      - name: Build installer
        shell: pwsh
        run: iscc scripts/installer.iss
        # scripts/installer.iss will be created in the Release phase (G3 phase 16); for now this workflow runs only on tags, which only release-please creates after Phase 1 is merged.
        # Do NOT silently skip — fail loudly if the file is missing.

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Locate installer exe (Inno Setup default output is Output/*.exe) and zip
          $installer = Get-ChildItem -Path "Output" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path "." -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*.exe" -or $_.DirectoryName -like "*Output*" } | Select-Object -First 1
          }
          $zip = Get-ChildItem -Path "MT5TradingWorkstation-*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            $zip = Get-ChildItem -Path "dist" -Filter "*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $installer) { Write-Error "Installer exe not found"; exit 1 }
          if (-not $zip) { Write-Error "Zip artifact not found"; exit 1 }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Zip: $($zip.FullName)"
          $hashInstaller = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLower()
          $hashZip = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLower()
          "$hashInstaller  $($installer.Name)" | Out-File -Encoding ascii checksums.txt
          "$hashZip  $($zip.Name)" | Out-File -Encoding ascii -Append checksums.txt
          Write-Host "Checksums:"
          Get-Content checksums.txt
          # Copy artifacts to workspace root for upload step
          Copy-Item $installer.FullName -Destination . -Force
          Copy-Item $zip.FullName -Destination . -Force
          Get-ChildItem -Filter "*.exe", "*.zip", "checksums.txt" | Format-Table Name, Length

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $installerName = (Get-ChildItem -Path "Output" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).Name
          if (-not $installerName) { $installerName = (Get-ChildItem -Filter "*Setup*.exe" | Select-Object -First 1).Name }
          $zipName = (Get-ChildItem -Filter "MT5TradingWorkstation-*.zip" | Select-Object -First 1).Name
          Write-Host "Uploading $installerName, $zipName, checksums.txt to release ${{ github.ref_name }}"
          gh release upload ${{ github.ref_name }} $installerName $zipName checksums.txt --clobber
