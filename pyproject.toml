[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-trading-workstation"
version = "0.1.0"
description = "MT5 Trading Workstation - Professional trading workstation for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Proprietary"}
authors = [{name = "MT5 Workstation Team"}]
dependencies = [
    "PySide6==6.8.0.2",
    "pyqtgraph==0.13.7",
    "MetaTrader5==5.0.45",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "loguru==0.7.2",
    "psutil==6.0.0",
    "httpx==0.27.2",
    "keyring==25.4.1",
    "PyYAML==6.0.2",
    "supabase==2.7.4",
    "lightgbm==4.5.0",
    "scikit-learn==1.5.2",
    "shap==0.46.0",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-qt==4.4.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-PyYAML==6.0.12.20240917",
    "pre-commit==4.0.1",
    "pyinstaller==6.10.0",
]

[project.scripts]
mt5-workstation = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S110 (try-except-pass) is widespread in early Qt widget scaffolding; Phase 2 (Observability)
# will replace these with loguru calls. T201 (print) is allowed in app/main.py for CLI flags
# like --self-check and --version.
ignore = ["S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S110", "S112", "S106", "S105"]
"app/main.py" = ["T201"]
"scripts/*.py" = ["T201", "S110"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_decorators = true
files = "app"
# Phase 1 has a few Qt-only code paths that we'll type-tighten in Phase 2.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["MetaTrader5", "pyqtgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "mt5: marks tests requiring a real MT5 terminal (deselect with '-m \"not mt5\"')",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
